<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Insights | Iniciar Sesión</title>
  <link rel="icon" id="dynamicFavicon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <script>
    (function() {
      var fav = localStorage.getItem('mkt_custom_favicon');
      if (fav) {
        var l = document.getElementById('dynamicFavicon');
        if (l) l.href = fav;
      }
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/executive-dashboard.css">
</head>
<body class="light-mode" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-color: var(--bg-main);">

  <div style="width: 100%; max-width: 440px;">
    
    <!-- Card de Login -->
    <div class="content-card" style="padding: 40px 36px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border-radius: var(--radius-lg);">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/assets/images/logo_cibergenios.png" alt="Cibergenios" style="max-height: 48px; margin: 0 auto 16px; display: block;">
        <h2 style="font-family: var(--font-heading); font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">
          Marketing Insights
        </h2>
        <p style="font-size: 13px; color: var(--text-muted);">
          Panel de Administración & Control Maestro
        </p>
      </div>

      <div id="errorMsg" style="display: none; padding: 12px 14px; background: var(--danger-red-bg); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); color: var(--danger-red-text); font-size: 12.5px; margin-bottom: 18px; font-weight: 600;">
        Credenciales no válidas. Acceso exclusivo para superadministradores.
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="loginEmail" class="form-input" required placeholder="correo@empresa.com" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div style="position: relative;">
            <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••••••" autocomplete="new-password" style="padding-right: 42px;">
            <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Mostrar contraseña" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 8px; display: flex; color: var(--text-muted);">
              <i data-lucide="eye" id="togglePasswordIcon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12.5px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" id="rememberMe" checked>
            <span>Recordar sesión</span>
          </label>
          <a href="/forgot-password.html" style="color: var(--primary-blue); text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
        </div>

        <div id="recaptchaBox" class="g-recaptcha" style="display: none; margin-bottom: 20px;"></div>

        <button type="submit" class="btn-action btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px; border-radius: var(--radius-sm);">
          <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
          <span>Iniciar Sesión</span>
        </button>

      </form>

    </div>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/cine-multiplex-villacentro/julio-2026?token=mkt_live_cmv_78a9c0f" style="font-size: 13px; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
        <span>← Ver Dashboard de Ejemplo (Cine Múltiplex)</span>
      </a>
    </div>

  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    function togglePasswordVisibility() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('togglePasswordIcon');
      const btn = document.getElementById('togglePasswordBtn');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
      btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    let recaptchaEnabled = false;
    let recaptchaWidgetId = null;

    window.onRecaptchaLoaded = function() {
      if (!recaptchaEnabled || recaptchaWidgetId !== null) return;
      recaptchaWidgetId = grecaptcha.render('recaptchaBox', { sitekey: window.__recaptchaSiteKey });
    };

    async function initRecaptcha() {
      try {
        const res = await fetch('/api/settings.php?action=public_recaptcha', { credentials: 'same-origin' });
        const data = await res.json();
        if (data.status === 'success' && data.enabled && data.site_key) {
          recaptchaEnabled = true;
          window.__recaptchaSiteKey = data.site_key;
          document.getElementById('recaptchaBox').style.display = 'block';
          const script = document.createElement('script');
          script.src = 'https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoaded&render=explicit';
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);
        }
      } catch (e) { /* si falla, el login sigue funcionando sin reCAPTCHA */ }
    }
    initRecaptcha();

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      if (recaptchaEnabled) {
        const token = typeof grecaptcha !== 'undefined' && recaptchaWidgetId !== null ? grecaptcha.getResponse(recaptchaWidgetId) : '';
        if (!token) {
          errEl.textContent = 'Confirma que no eres un robot.';
          errEl.style.display = 'block';
          return;
        }
      }

      try {
        const form = new URLSearchParams();
        form.set('user', email);
        form.set('pass', pass);
        if (recaptchaEnabled && typeof grecaptcha !== 'undefined' && recaptchaWidgetId !== null) {
          form.set('g-recaptcha-response', grecaptcha.getResponse(recaptchaWidgetId));
        }
        const res = await fetch('/api/login.php', { method: 'POST', body: form, credentials: 'same-origin' });
        const data = await res.json();
        if (data.status === 'success') {
          window.location.href = '/admin';
        } else {
          errEl.textContent = data.message || 'Credenciales no válidas.';
          errEl.style.display = 'block';
          if (recaptchaEnabled && typeof grecaptcha !== 'undefined' && recaptchaWidgetId !== null) {
            grecaptcha.reset(recaptchaWidgetId);
          }
        }
      } catch (err) {
        errEl.textContent = 'Error de conexión con el servidor.';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
