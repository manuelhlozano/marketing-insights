<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ruleta de Premios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(160deg, #0B3D91 0%, #1565D8 55%, #3B9AE1 100%);
    background-size: cover; background-position: center;
    color: #0f172a;
    user-select: none;
  }
  #stage {
    height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 24px; gap: 10px; text-align: center; overflow: hidden;
  }
  #brandHeader { flex-shrink: 0; padding: 4px 0 2px; }
  #brandLogo {
    max-height: 62px; max-width: min(320px, 60vw); object-fit: contain;
    background: #fff; padding: 8px 20px; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  #mainRow {
    flex: 1; width: 100%; max-width: 1080px; min-height: 0;
    display: flex; align-items: center; justify-content: center; gap: 44px; flex-wrap: wrap;
  }
  .col-wheel { flex: 0 0 auto; }
  .col-info {
    flex: 1 1 300px; max-width: 400px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  #titulo {
    color: #fff; font-size: clamp(20px, 3.4vw, 32px); font-weight: 900;
    text-shadow: 0 3px 14px rgba(0,0,0,.35); line-height: 1.2;
  }
  #wheelWrap { position: relative; width: min(74vh, 620px); height: min(74vh, 620px); }
  @media (max-width: 720px) {
    #mainRow { flex-direction: column; gap: 22px; }
    #wheelWrap { width: min(84vw, 420px); height: min(84vw, 420px); }
  }
  #pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 20px solid transparent; border-right: 20px solid transparent;
    border-top: 34px solid #FDE047;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  #wheel {
    width: 100%; height: 100%; border-radius: 50%;
    border: 10px solid #fff; box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 0 0 3px #0B3D91;
    position: relative; transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  #wheelHub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 22%; height: 22%; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #0B3D91; font-size: 13px;
    overflow: hidden; padding: 6%;
  }
  #wheelHub img { width: 100%; height: 100%; object-fit: contain; }
  /* Recreación en CSS del "21 años" mientras se recibe el arte original del cliente
     (ver campo "Imagen del centro de la rueda" en el admin, que reemplaza esto). */
  .hub21 { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .8; }
  .hub21 .nums { font-size: clamp(20px, 4.5vw, 34px); font-weight: 900; letter-spacing: -.03em; }
  .hub21 .n2 { color: #F97316; }
  .hub21 .n1 { color: #1D4ED8; }
  .hub21 .anos { font-family: 'Dancing Script', cursive; font-size: clamp(10px, 2vw, 15px); font-weight: 700; color: #F97316; margin-top: -2px; }
  .segment-label {
    position: absolute; top: 50%; left: 50%; transform-origin: 0 0;
    font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45);
    width: 46%; text-align: right; white-space: nowrap; letter-spacing: -.01em;
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  }
  .segment-label i { font-size: 14px; flex-shrink: 0; }
  #girarBtn {
    background: #0F172A; color: #fff; border: none; border-radius: 999px;
    padding: 16px 46px; font-size: 18px; font-weight: 800; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); transition: transform .15s;
  }
  #girarBtn:active { transform: scale(0.96); }
  #girarBtn:disabled { opacity: .5; cursor: not-allowed; }
  #hint { color: rgba(255,255,255,.9); font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  #hint kbd {
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.5);
    border-radius: 6px; padding: 2px 10px; font-weight: 800; margin: 0 3px;
  }

  #resultOverlay {
    position: fixed; inset: 0; background: rgba(6,12,28,.82); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #resultCard {
    background: #fff; border-radius: 20px; padding: 40px 36px; text-align: center;
    max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #resultTitle { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
  #resultTitle.win { color: #059669; }
  #resultTitle.lose { color: #64748B; }
  #resultPremio { font-size: 19px; font-weight: 700; color: #0f172a; margin-bottom: 22px; }
  #resultActions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 10px; padding: 12px 22px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: #0B3D91; color: #fff; }
  .btn-ghost { background: #E2E8F0; color: #0f172a; }

  #loadingBox, #errorBox {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 600; text-align: center; padding: 30px; z-index: 60;
  }
  #errorBox { display: none; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

  <div id="loadingBox">Cargando ruleta…</div>
  <div id="errorBox"></div>

  <div id="stage" style="display:none;">
    <header id="brandHeader"><img id="brandLogo" src="" alt="" style="display:none;"></header>

    <div id="mainRow">
      <div class="col-wheel">
        <div id="wheelWrap">
          <div id="pointer"></div>
          <div id="wheel">
            <div id="wheelHub">
              <div class="hub21"><span class="nums"><span class="n2">2</span><span class="n1">1</span></span><span class="anos">años</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-info">
        <h1 id="titulo">¡Gira y gana!</h1>
        <button id="girarBtn">¡Girar la Ruleta!</button>
        <p id="hint">Presiona <kbd>ESPACIO</kbd> o toca el botón para girar</p>
      </div>
    </div>
  </div>

  <div id="resultOverlay">
    <div id="resultCard">
      <div id="resultTitle"></div>
      <div id="resultPremio"></div>
      <div id="resultActions">
        <button class="btn btn-primary" id="btnImprimir" onclick="imprimirFichaRuleta()" style="display:none;">Imprimir Ficha del Premio</button>
        <button class="btn btn-ghost" onclick="cerrarResultado()">Girar de Nuevo</button>
      </div>
    </div>
  </div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('e') || params.get('token') || '';
  const API = '/api/ruleta-publica.php';

  let premios = [];
  let girando = false;
  let ultimoGiroId = null;
  let anchoTicket = '80mm';
  let acumuladoRotacion = 0;

  function escHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeRelativePath(p) {
    // Solo permite rutas relativas del propio servidor (nunca javascript:, data: ni //host externo).
    if (!p || typeof p !== 'string') return '';
    if (/^(javascript|data):/i.test(p) || p.startsWith('//') || /^[a-z]+:\/\//i.test(p)) return '';
    return p.replace(/^\/+/, '');
  }
  function safeImageSrc(p) {
    // Igual que safeRelativePath, pero también admite imágenes externas https:// (ej. logo/gráfica alojada aparte).
    if (!p || typeof p !== 'string') return '';
    if (/^https:\/\//i.test(p)) return p;
    const rel = safeRelativePath(p);
    return rel ? '/' + rel : '';
  }
  function safeIcono(i) {
    // Solo slugs válidos de Tabler Icons (letras, números y guiones) — nunca se usa texto libre en la clase CSS.
    return /^[a-z0-9-]{1,60}$/.test(i || '') ? i : '';
  }

  function showError(msg) {
    document.getElementById('loadingBox').style.display = 'none';
    const box = document.getElementById('errorBox');
    box.style.display = 'flex';
    box.textContent = msg;
  }

  async function cargarDetalle() {
    if (!token) { showError('Falta el enlace de la estación. Pide al administrador la URL correcta de esta taquilla/cajero.'); return; }
    try {
      const res = await fetch(`${API}?action=detalle&token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (data.status !== 'success') { showError(data.message || 'No se pudo cargar la ruleta.'); return; }

      premios = data.ruleta_premios_local = data.premios;
      anchoTicket = data.estacion.ancho_ticket;

      document.getElementById('titulo').textContent = data.ruleta.titulo_publico;
      document.title = data.ruleta.titulo_publico;
      if (data.ruleta.imagen_fondo_url && /^https:\/\//i.test(data.ruleta.imagen_fondo_url)) {
        document.body.style.backgroundImage = `url('${data.ruleta.imagen_fondo_url.replace(/'/g, '%27')}')`;
      }
      const durMs = Math.max(1, data.ruleta.duracion_segundos) * 1000;
      document.getElementById('wheel').style.transitionDuration = (durMs / 1000) + 's';

      const logoSrc = safeImageSrc(data.empresa.logo_url);
      if (logoSrc) {
        const logoEl = document.getElementById('brandLogo');
        logoEl.src = logoSrc;
        logoEl.alt = data.empresa.nombre || '';
        logoEl.style.display = '';
      }

      const centroSrc = safeImageSrc(data.ruleta.imagen_centro_url);
      if (centroSrc) {
        document.getElementById('wheelHub').innerHTML = `<img src="${escHtml(centroSrc)}" alt="">`;
      }

      construirRueda(premios);

      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('stage').style.display = 'flex';
    } catch (e) {
      showError('Error de conexión. Verifica la red del punto de venta.');
    }
  }

  // La rueda se dibuja con N tajadas del MISMO tamaño (como una ruleta real de
  // feria), repitiendo cada premio tantas veces como le corresponda según su
  // probabilidad, e intercalando las tajadas de cada premio para que no
  // queden todas juntas (evita el efecto "cuña gigante + astilla" que se ve
  // desprolijo). El sorteo real sigue decidiéndose en el servidor por
  // probabilidad exacta; esto es solo la representación visual.
  const TOTAL_TAJADAS = 12;
  // Paleta arcoíris fija por posición de tajada (no por premio) — así se ve
  // como una ruleta de feria real, con colores intercalados aunque un mismo
  // premio se repita en varias tajadas.
  const SLICE_PALETTE = ['#EF4444', '#F97316', '#F59E0B', '#84CC16', '#10B981', '#06B6D4', '#3B82F6', '#6366F1', '#8B5CF6', '#A855F7', '#EC4899', '#F43F5E'];
  let tajadas = []; // [{ premio, color, anguloDesde, anguloHasta, anguloMedio }]

  function calcularTajadasPorPremio(premios, total) {
    // Reparto por mayor resto (Hare-Niemeyer) para que la suma dé exacto `total`.
    const base = premios.map(p => (p.probabilidad / 100) * total);
    const counts = base.map(Math.floor);
    let asignadas = counts.reduce((a, b) => a + b, 0);
    const restos = base.map((v, i) => ({ i, resto: v - counts[i] })).sort((a, b) => b.resto - a.resto);
    let idx = 0;
    while (asignadas < total && idx < restos.length) {
      counts[restos[idx].i]++;
      asignadas++;
      idx++;
    }
    // Ningún premio con probabilidad > 0 debería quedar en 0 tajadas.
    premios.forEach((p, i) => { if (p.probabilidad > 0 && counts[i] === 0) counts[i] = 1; });
    return premios.map((p, i) => ({ premio: p, count: counts[i] }));
  }

  function intercalarTajadas(grupos, total) {
    // Distribuye cada grupo lo más espaciado posible dentro del círculo,
    // procesando primero los grupos con más tajadas (estilo "reorganize string").
    const slots = new Array(total).fill(null);
    const ordenados = [...grupos].sort((a, b) => b.count - a.count);
    ordenados.forEach(g => {
      for (let k = 0; k < g.count; k++) {
        let idx = Math.round((k * total) / g.count) % total;
        while (slots[idx] !== null) idx = (idx + 1) % total;
        slots[idx] = g.premio;
      }
    });
    return slots;
  }

  function construirRueda(premios) {
    const wheel = document.getElementById('wheel');
    const grupos = calcularTajadasPorPremio(premios, TOTAL_TAJADAS);
    const orden = intercalarTajadas(grupos, TOTAL_TAJADAS);
    const anguloTajada = 360 / TOTAL_TAJADAS;

    tajadas = orden.map((premio, i) => ({
      premio,
      color: SLICE_PALETTE[i % SLICE_PALETTE.length],
      anguloDesde: i * anguloTajada,
      anguloHasta: (i + 1) * anguloTajada,
      anguloMedio: i * anguloTajada + anguloTajada / 2,
    }));

    const stops = tajadas.map(t => `${t.color} ${t.anguloDesde}deg ${t.anguloHasta}deg`);
    wheel.style.background = `conic-gradient(${stops.join(', ')})`;

    document.querySelectorAll('.segment-label').forEach(el => el.remove());
    tajadas.forEach(t => {
      const label = document.createElement('div');
      label.className = 'segment-label';
      const icono = safeIcono(t.premio.icono);
      label.innerHTML = (icono ? `<i class="ti ti-${icono}"></i>` : '') + `<span>${escHtml(t.premio.nombre)}</span>`;
      label.style.transform = `rotate(${t.anguloMedio}deg) translateX(8%)`;
      wheel.appendChild(label);
    });
  }

  async function girar() {
    if (girando || premios.length === 0) return;
    girando = true;
    document.getElementById('girarBtn').disabled = true;

    try {
      const form = new URLSearchParams();
      form.set('action', 'girar');
      form.set('token', token);
      const res = await fetch(API, { method: 'POST', body: form });
      const data = await res.json();
      if (data.status !== 'success') {
        alert(data.message || 'No se pudo girar la ruleta.');
        girando = false;
        document.getElementById('girarBtn').disabled = false;
        return;
      }

      animarHaciaPremio(data.premio.id, () => mostrarResultado(data));
    } catch (e) {
      alert('Error de conexión al girar.');
      girando = false;
      document.getElementById('girarBtn').disabled = false;
    }
  }

  function anguloDelPremio(premioId) {
    const candidatas = tajadas.filter(t => t.premio.id === premioId);
    if (candidatas.length === 0) return 0;
    const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
    return elegida.anguloMedio;
  }

  function animarHaciaPremio(premioId, onDone) {
    const wheel = document.getElementById('wheel');
    const anguloObjetivo = anguloDelPremio(premioId);
    // El puntero está fijo arriba (0deg); para que el segmento quede bajo el
    // puntero hay que rotar la rueda en sentido contrario a su ángulo, más
    // varias vueltas completas para el efecto visual del giro.
    const vueltasExtra = 6 * 360;
    acumuladoRotacion += vueltasExtra + (360 - anguloObjetivo) - (acumuladoRotacion % 360);
    wheel.style.transform = `rotate(${acumuladoRotacion}deg)`;

    const durMs = parseFloat(getComputedStyle(wheel).transitionDuration) * 1000 || 5000;
    setTimeout(onDone, durMs + 150);
  }

  function mostrarResultado(data) {
    girando = false;
    ultimoGiroId = data.giro_id;
    const titleEl = document.getElementById('resultTitle');
    const premioEl = document.getElementById('resultPremio');
    const btnImprimir = document.getElementById('btnImprimir');

    if (data.premio.es_perdedor) {
      titleEl.textContent = '¡Ups, no ganaste!';
      titleEl.className = 'lose';
      premioEl.textContent = 'Gracias por participar. ¡Vuelve a intentarlo en tu próxima compra!';
      btnImprimir.style.display = 'none';
    } else {
      titleEl.textContent = '¡ERES GANADOR!';
      titleEl.className = 'win';
      premioEl.textContent = data.premio.nombre;
      btnImprimir.style.display = 'inline-block';
    }

    document.getElementById('resultOverlay').style.display = 'flex';
  }

  function cerrarResultado() {
    document.getElementById('resultOverlay').style.display = 'none';
    document.getElementById('girarBtn').disabled = false;
  }
  window.cerrarResultado = cerrarResultado;

  window.imprimirFichaRuleta = async function() {
    if (!ultimoGiroId) return;
    try {
      const res = await fetch(`${API}?action=ticket&token=${encodeURIComponent(token)}&giro_id=${ultimoGiroId}`);
      const data = await res.json();
      if (data.status !== 'success') { alert(data.message || 'No se pudo generar la ficha.'); return; }

      const widthMm = data.ancho_ticket === '58mm' ? 58 : 80;
      const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de Premio</title>
<style>
  @page { size: ${widthMm}mm auto; margin: 0; }
  * { box-sizing: border-box; }
  body {
    width: ${widthMm}mm; margin: 0; padding: 4mm 3mm;
    font-family: 'Courier New', monospace; color: #000; text-align: center;
  }
  .logo { max-width: 70%; max-height: 18mm; object-fit: contain; margin-bottom: 2mm; }
  .empresa { font-size: 11px; font-weight: 700; margin-bottom: 3mm; }
  .titulo { font-size: 16px; font-weight: 900; letter-spacing: 1px; margin: 3mm 0; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 2mm 0; }
  .premio { font-size: 14px; font-weight: 800; margin: 3mm 0; }
  table { width: 100%; font-size: 10px; margin-top: 3mm; border-collapse: collapse; }
  table td { padding: 1mm 0; text-align: left; }
  table td.v { text-align: right; font-weight: 700; }
  .footer { font-size: 8.5px; margin-top: 4mm; color: #333; }
</style>
</head>
<body>
  ${safeRelativePath(data.logo_url) ? `<img class="logo" src="/${escHtml(safeRelativePath(data.logo_url))}">` : ''}
  <div class="empresa">${escHtml(data.empresa_nombre)}</div>
  <div class="titulo">¡ERES GANADOR!</div>
  <div class="premio">${escHtml(data.premio_nombre)}</div>
  <table>
    <tr><td>Fecha</td><td class="v">${escHtml(data.fecha)}</td></tr>
    <tr><td>Hora</td><td class="v">${escHtml(data.hora)}</td></tr>
    <tr><td>ID Giro</td><td class="v">#${Number(data.giro_id) || 0}</td></tr>
    <tr><td>${data.estacion_tipo === 'cajero' ? 'Cajero' : 'Taquilla'}</td><td class="v">${escHtml(data.estacion_nombre)}</td></tr>
  </table>
  <div class="footer">Presenta esta ficha para reclamar tu premio. Documento generado por Marketing Insights — Cibergenios.</div>
  ${'<scr' + 'ipt>'}window.onload = function() { window.print(); };${'</scr' + 'ipt>'}
</body>
</html>`;

      const w = window.open('', '_blank');
      if (!w) { alert('El navegador bloqueó la ventana emergente. Habilítala para imprimir la ficha.'); return; }
      w.document.write(html);
      w.document.close();
    } catch (e) {
      alert('Error al generar la ficha de impresión.');
    }
  };

  document.getElementById('girarBtn').addEventListener('click', girar);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (document.getElementById('resultOverlay').style.display === 'flex') return;
      girar();
    }
  });

  cargarDetalle();
})();
</script>

</body>
</html>
