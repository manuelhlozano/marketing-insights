<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña | Marketing Insights</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/executive-dashboard.css">
</head>
<body class="light-mode" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-color: var(--bg-main);">

  <div style="width: 100%; max-width: 440px;">
    <div class="content-card" style="padding: 40px 36px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border-radius: var(--radius-lg);">

      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/assets/images/logo_cibergenios.png" alt="Cibergenios" style="max-height: 48px; margin: 0 auto 16px; display: block;">
        <h2 style="font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">
          Recuperar Contraseña
        </h2>
        <p style="font-size: 13px; color: var(--text-muted);">
          Te enviaremos un enlace a tu correo para restablecerla.
        </p>
      </div>

      <div id="msgBox" style="display: none; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 18px; font-weight: 600;"></div>

      <form id="forgotForm" onsubmit="handleForgot(event)">
        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="fpEmail" class="form-input" required placeholder="correo@empresa.com">
        </div>

        <button type="submit" id="fpSubmitBtn" class="btn-action btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px; border-radius: var(--radius-sm);">
          <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
          <span>Enviar Enlace</span>
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/login" style="font-size: 13px; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
        <span>← Volver a Iniciar Sesión</span>
      </a>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('fpEmail').value.trim();
      const msgBox = document.getElementById('msgBox');
      const btn = document.getElementById('fpSubmitBtn');
      msgBox.style.display = 'none';
      btn.disabled = true;

      try {
        const form = new URLSearchParams();
        form.set('action', 'request');
        form.set('email', email);
        const res = await fetch('/api/password-reset.php', { method: 'POST', body: form });
        const data = await res.json();

        msgBox.textContent = data.message || 'Si el correo existe, te enviamos un enlace.';
        msgBox.style.display = 'block';
        if (data.status === 'success') {
          msgBox.style.background = 'var(--success-green-bg)';
          msgBox.style.color = 'var(--success-green-text)';
          msgBox.style.border = '1px solid rgba(16,185,129,0.3)';
          document.getElementById('forgotForm').style.display = 'none';
        } else {
          msgBox.style.background = 'var(--danger-red-bg)';
          msgBox.style.color = 'var(--danger-red-text)';
          msgBox.style.border = '1px solid rgba(239,68,68,0.3)';
          btn.disabled = false;
        }
      } catch (err) {
        msgBox.textContent = 'Error de conexión con el servidor.';
        msgBox.style.display = 'block';
        msgBox.style.background = 'var(--danger-red-bg)';
        msgBox.style.color = 'var(--danger-red-text)';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
