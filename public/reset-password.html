<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña | Marketing Insights</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/executive-dashboard.css">
</head>
<body class="light-mode" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background-color: var(--bg-main);">

  <div style="width: 100%; max-width: 440px;">
    <div class="content-card" style="padding: 40px 36px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); border-radius: var(--radius-lg);">

      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/assets/images/logo_cibergenios.png" alt="Cibergenios" style="max-height: 48px; margin: 0 auto 16px; display: block;">
        <h2 style="font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">
          Restablecer Contraseña
        </h2>
        <p style="font-size: 13px; color: var(--text-muted);" id="rpSubtitle">
          Ingresa tu nueva contraseña.
        </p>
      </div>

      <div id="msgBox" style="display: none; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 18px; font-weight: 600;"></div>

      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label">Nueva Contraseña</label>
          <div style="position: relative;">
            <input type="password" id="rpPassword" class="form-input" required minlength="8" placeholder="Mínimo 8 caracteres" style="padding-right: 42px;">
            <button type="button" onclick="togglePw('rpPassword', 'rpIcon1')" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 8px; display: flex; color: var(--text-muted);">
              <i data-lucide="eye" id="rpIcon1" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar Contraseña</label>
          <div style="position: relative;">
            <input type="password" id="rpPassword2" class="form-input" required minlength="8" placeholder="Repite la contraseña" style="padding-right: 42px;">
            <button type="button" onclick="togglePw('rpPassword2', 'rpIcon2')" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 8px; display: flex; color: var(--text-muted);">
              <i data-lucide="eye" id="rpIcon2" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="rpSubmitBtn" class="btn-action btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 14px; border-radius: var(--radius-sm);">
          <i data-lucide="key" style="width: 16px; height: 16px;"></i>
          <span>Restablecer Contraseña</span>
        </button>
      </form>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/login" style="font-size: 13px; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
        <span>← Volver a Iniciar Sesión</span>
      </a>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();

    const token = new URLSearchParams(window.location.search).get('token') || '';
    if (!token) {
      document.getElementById('rpSubtitle').textContent = 'Enlace inválido: falta el token.';
      document.getElementById('resetForm').style.display = 'none';
    }

    function togglePw(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function handleReset(e) {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      const btn = document.getElementById('rpSubmitBtn');
      msgBox.style.display = 'none';

      const p1 = document.getElementById('rpPassword').value;
      const p2 = document.getElementById('rpPassword2').value;
      if (p1 !== p2) {
        msgBox.textContent = 'Las contraseñas no coinciden.';
        msgBox.style.display = 'block';
        msgBox.style.background = 'var(--danger-red-bg)';
        msgBox.style.color = 'var(--danger-red-text)';
        return;
      }

      btn.disabled = true;
      try {
        const form = new URLSearchParams();
        form.set('action', 'confirm');
        form.set('token', token);
        form.set('password', p1);
        const res = await fetch('/api/password-reset.php', { method: 'POST', body: form });
        const data = await res.json();

        msgBox.textContent = data.message || '';
        msgBox.style.display = 'block';
        if (data.status === 'success') {
          msgBox.style.background = 'var(--success-green-bg)';
          msgBox.style.color = 'var(--success-green-text)';
          document.getElementById('resetForm').style.display = 'none';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          msgBox.style.background = 'var(--danger-red-bg)';
          msgBox.style.color = 'var(--danger-red-text)';
          btn.disabled = false;
        }
      } catch (err) {
        msgBox.textContent = 'Error de conexión con el servidor.';
        msgBox.style.display = 'block';
        msgBox.style.background = 'var(--danger-red-bg)';
        msgBox.style.color = 'var(--danger-red-text)';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
